name: app
description: Secret-Sauce — cross-platform recipe vault (adaptive web + mobile).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

dev_dependencies:
  # No build_runner here on purpose: `apps/app` has no freezed/json/riverpod
  # annotated sources, so all codegen happens in `packages/core`.
  # If you add a `part '<name>.g.dart';` under apps/app/lib, re-add build_runner
  # and its builders here first — melos filters that script on `dependsOn:
  # build_runner`, so it will skip this package, report SUCCESS, and the failure
  # surfaces later as `Target of URI doesn't exist` from `melos run analyze`.
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter

# Pin path_provider_android to the last pre-JNI release. 2.3.x migrated to a
# native (JNI/CMake) build, which requires downloading the Android CMake package
# at build time — avoided here so the APK builds without native toolchain setup.
dependency_overrides:
  path_provider_android: ">=2.2.0 <2.3.0"

flutter:
  uses-material-design: true

# Launcher icon generation. Put a 1024x1024 PNG at assets/icon/app_icon.png,
# then run:  melos run gen:icons   (or: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  # Optional adaptive icon for Android (foreground PNG + background colour):
  # adaptive_icon_background: "#1E1B18"
  # adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
