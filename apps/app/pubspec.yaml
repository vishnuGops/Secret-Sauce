name: app
description: Secret-Sauce — cross-platform recipe vault (adaptive web + mobile).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

dev_dependencies:
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
