name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, NOT `channel: stable`. Flutter >= 3.47 ships Dart 3.13, which the
      # analyzer 7.x behind freezed 2.x cannot parse -> build_runner crashes.
      # See docs/BUG-TRACKER.md B005 and README.md#toolchain-versions.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      # Pin to the 6.x line the workspace declares (root pubspec: melos ^6.1.0).
      - name: Activate melos
        run: dart pub global activate melos 6.3.3

      - name: Bootstrap
        run: melos bootstrap

      # `--no-select` on every script that declares packageFilters: without a TTY the
      # package picker aborts with "StdinException: Error getting terminal echo mode".
      # See docs/BUG-TRACKER.md B006.
      - name: Codegen
        run: melos run build_runner --no-select

      # 32f1. `melos run format` was safe again from OPT-T4 on (B027) and
      # nothing checked that anyone had run it. Only **tracked** files: the
      # generated `*.g.dart` / `*.freezed.dart` are git-ignored and written by
      # a builder whose formatter version is not this one's to police.
      # `--output=none` checks without rewriting.
      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test --no-select

      # Lints recipeData/recipes/*.json and fails if supabase/seed_recipes.sql
      # was not regenerated after a recipe changed. Nothing reads the JSON at
      # runtime, so without this a stale .sql would be applied to a database
      # and nobody would notice. Needs no database — it is a file comparison.
      - name: Recipe data
        run: melos run recipes:check

      # Same gate for the simulation dish library, plus its directory-level
      # coverage rules (all 10 categories, >= 24 cuisines, a no-cook dish, an
      # overnight step, a multi-group dish). The generator's output is only as
      # varied as this library, and no assertion downstream would notice a gap.
      - name: Sim dish library
        run: melos run sim:check

      # Same gate for the food registry (Phase 29a): lints nutritionData/ and
      # fails if supabase/nutrition_foods.sql is stale. Works offline — the
      # USDA CSV bundle is an authoring-time input only, never in CI.
      - name: Food registry
        run: melos run nutrition:check

  # 32f4. Nothing in CI compiled a release build, and `flutter test` does not:
  # the test harness runs on the VM, while a web release build runs dart2js over
  # the whole program. A tree-shaking or deferred-loading failure, or a plugin
  # with no web implementation, is invisible to every other job here.
  #
  # It proves **compilation**, not runtime — `env.example.json` holds a
  # placeholder URL and key, which is fine because they are only baked in as
  # strings. Nothing here connects to anything.
  build-web:
    name: Web release build (compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      - name: Activate melos
        run: dart pub global activate melos 6.3.3

      - name: Bootstrap
        run: melos bootstrap

      - name: Codegen
        run: melos run build_runner --no-select

      - name: Build web
        working-directory: apps/app
        run: flutter build web --release --dart-define-from-file=env.example.json
