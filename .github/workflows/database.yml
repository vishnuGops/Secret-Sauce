name: Database

# The SQL half of this repo had no automated coverage at all (OPT-T1). The
# triggers, the RLS policies, the grants, the ranking RPCs and the 46 sim
# assertions were verified only by hand, on one machine, and recorded in
# BUG-TRACKER.md afterwards — which is how B024 shipped through a green run of
# both paths that are convenient to test locally.
#
# **No secret is involved and none may be added.** Every statement here runs
# against the ephemeral Supabase stack this job starts inside the runner, at
# the CLI's fixed local address. `tool/db.dart` fires at whatever
# `SUPABASE_DB_URL` points at with no prod guard (CLAUDE.md Gotcha 7), so wiring
# a `SUPABASE_DB_URL` secret into CI would aim `drop.sql` at whatever that
# secret happens to be. The URL below is hard-coded for exactly that reason.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'recipeData/**'
      - 'simData/**'
      - 'nutritionData/**'
      - 'tool/**'
      - '.github/workflows/database.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'recipeData/**'
      - 'simData/**'
      - 'nutritionData/**'
      - 'tool/**'
      - '.github/workflows/database.yml'

env:
  # The Supabase CLI's local database, inside this runner. Not a secret, not
  # reachable from outside the job.
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  # The same address, under the name `tool/db.dart` reads (32f2). It is a
  # literal here and must stay one: the tool fires at whatever this points at
  # with no prod guard (CLAUDE.md Gotcha 7), so a repository *secret* in this
  # position would aim `drop` at whatever the secret happens to be.
  SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  PSQL: psql -v ON_ERROR_STOP=1 --quiet

jobs:
  schema:
    name: Schema, seed, sim
    runs-on: ubuntu-latest
    # `supabase start` pulls a handful of images on a cold runner.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade-path step needs the previous version of the baseline,
          # which means history, not a shallow clone.
          fetch-depth: 0

      # Pinned, like every other component of this toolchain (32f3). `latest`
      # was the one moving part in a repo that pins Flutter to a patch: the CLI
      # chooses the Postgres image the whole job runs against, so a release that
      # bumped the major would change what CI proves without a commit here.
      # 2.108.0 starts **PostgreSQL 15.8** (`supabase_db_*`), which is what the
      # measurements and the B079 client-version note describe.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      # `tool/db.dart` is plain Dart over `psql` — the root package has no
      # Flutter dependency — but the SDK still has to be the pinned one, and
      # `dart run` needs a package config, hence the `pub get`.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      - name: Resolve the workspace root (for tool/db.dart)
        run: dart pub get

      - name: Ensure a psql client
        run: |
          command -v psql >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          }
          psql --version

      # Only the database is needed. Studio, realtime, storage, the edge runtime
      # and the analytics stack are all cost with no assertion behind them —
      # but the DB container itself is mandatory: `0001_init.sql` references
      # `auth.users`, so plain Postgres cannot apply it.
      - name: Start the local stack (database only)
        run: |
          supabase start \
            -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor \
            --ignore-health-check

      # ------------------------------------------------------------------
      # Path 1 — a fresh database, the way a new machine sees the project.
      #
      # Through `tool/db.dart` rather than a bash transcription of it (32f2).
      # The ordering — drop, baseline, registry before recipes (29b's food_id
      # FK), then the sim — used to live in three places (the tool, this file,
      # and `config.toml`'s `db.seed.sql_paths`), and only two of them were ever
      # executed here. Now the file CI runs is the file a developer runs, so a
      # `db:reset` that breaks breaks here.
      # ------------------------------------------------------------------
      - name: Fresh apply — db:reset through the real tool
        run: dart run tool/db.dart reset --preset=small --seed=20260820

      # ------------------------------------------------------------------
      # The RLS acceptance matrix (ROADMAP BL-7). Every other step in this job
      # runs as `postgres`, which bypasses policies outright — so until this
      # step existed, CI could not have caught B053 (a SELECT policy that could
      # not see its own `INSERT … RETURNING` row) or B061 (a `with check` that
      # let a stranger like a recipe they cannot read). It switches role to
      # `authenticated` inside a transaction and rolls back, so it leaves the
      # database exactly as the step above left it.
      # ------------------------------------------------------------------
      - name: RLS matrix — as a signed-in user
        run: dart run tool/db.dart rls

      # ------------------------------------------------------------------
      # The auto-nutrition arithmetic (Phase 29c): fixture trees with known
      # gram weights through estimate_nutrition/match_foods, exact expected
      # labels, rolled back. This file is that SQL's ONLY coverage — the
      # matrix proves the policy geometry, not that a cup of flour weighs
      # 120 g. Self-sufficient: brings its own foods/units, so it does not
      # depend on nutrition_foods.sql being loaded.
      # ------------------------------------------------------------------
      - name: Nutrition estimator — fixture trees, exact labels
        run: dart run tool/db.dart nutrition:estimate

      # ------------------------------------------------------------------
      # The other half (Phase 29d), and the only one that needs the REAL
      # registry loaded: `seed_recipes.sql`'s twelve `source = 'auto'` labels
      # are static JSON. `recipes:check` proves that SQL matches recipeData/;
      # nothing proves the numbers inside it still match nutritionData/. This
      # re-estimates every one of them and fails on drift, and exercises
      # `recompute_auto_nutrition()` — including its empty-registry guard —
      # by breaking things on purpose inside a transaction it rolls back.
      # ------------------------------------------------------------------
      - name: Nutrition fixtures — committed labels vs. the registry
        run: dart run tool/db.dart nutrition:verify

      # The population is built by the `reset` above, at `small` (250 accounts)
      # rather than `tiny` (60): four assertions in `3_sim_verify.sql` gate on
      # `v_users >= 250` — E3 (the exposure tail) and the whole of group G,
      # which includes **G3, the only automated guard on `sim.fork_bias` and
      # therefore on MOST FORKED ranking anything at all**. At `tiny` the shelf
      # RPCs were executed but their row counts never asserted, so
      # `ALL CHECKS PASSED` meant 42 of 46 and said nothing about them.
      # This step re-runs the assertions read-only, so the log names them as
      # their own gate rather than burying them in the apply above.
      - name: Simulated population — assertions
        run: dart run tool/db.dart sim:verify

      # ------------------------------------------------------------------
      # Path 2 — re-apply everything on top of itself. Every file in this repo
      # claims to be idempotent; this is the only thing that checks.
      # ------------------------------------------------------------------
      - name: Re-apply (idempotency)
        run: |
          dart run tool/db.dart create
          dart run tool/db.dart nutrition
          dart run tool/db.dart seed
          dart run tool/db.dart recipes
          dart run tool/db.dart sim:verify

      # ------------------------------------------------------------------
      # Path 3 — the upgrade path (CLAUDE.md Gotcha 6). Neither of the paths
      # above can surface a stale-object bug, because both build from nothing.
      # A deployed database takes this third one: the PREVIOUS baseline is
      # already applied, and today's is layered on top. B024 shipped green
      # through paths 1 and 2.
      # ------------------------------------------------------------------
      - name: Upgrade path — previous baseline, then this one
        run: |
          prev=$(git log -n 2 --format=%H -- supabase/migrations/0001_init.sql | tail -1)
          head=$(git log -n 1 --format=%H -- supabase/migrations/0001_init.sql)
          if [ "$prev" = "$head" ]; then
            echo "::notice::Only one revision of the baseline exists — nothing to upgrade from."
            exit 0
          fi
          echo "Upgrading from $prev"
          git show "$prev:supabase/migrations/0001_init.sql" > /tmp/previous_init.sql

          # `psql` directly for these two: the previous baseline is a file
          # `tool/db.dart` has no name for, which is the whole point of the step.
          $PSQL "$DB_URL" -f supabase/scripts/drop.sql
          $PSQL "$DB_URL" -1 -f /tmp/previous_init.sql
          $PSQL "$DB_URL" -1 -f supabase/seed.sql
          # Today's schema on top of yesterday's database, then the registry —
          # the B045 shape: its tables exist only after today's baseline runs.
          dart run tool/db.dart create
          dart run tool/db.dart nutrition
          dart run tool/db.dart recipes

      # ------------------------------------------------------------------
      # 32f3. Both of these used to run against the FRESH database only, so an
      # upgrade that left a policy or a generator broken passed CI: the two
      # things that actually exercise behaviour never saw the upgraded schema.
      # The sim is rebuilt rather than re-verified — `drop.sql` took its recipes
      # with it while sparing `auth.users`, so the registry points at rows that
      # no longer exist (B054), and asserting over that would be asserting over
      # nothing.
      #
      # Both run whatever the step above did: on the very first revision of the
      # baseline there is nothing to upgrade *from*, so they re-check the fresh
      # database instead. That is a weaker claim than the step names, and it is
      # the right trade — the alternative is a conditional that goes stale.
      # ------------------------------------------------------------------
      - name: RLS matrix — after the upgrade path
        run: dart run tool/db.dart rls

      - name: Simulated population — rebuilt on the upgraded schema
        run: |
          dart run tool/db.dart sim:clean --yes
          dart run tool/db.dart sim --preset=small --seed=20260820

      - name: Smoke — the surfaces the app actually calls
        run: |
          $PSQL "$DB_URL" -c "select count(*) from recipes_popular(5, 0);"
          $PSQL "$DB_URL" -c "select count(*) from recipes_trending(5, 0);"
          $PSQL "$DB_URL" -c "select count(*) from recipes_search('chicken', 5, 0);"
          $PSQL "$DB_URL" -c "select count(*) from chefs_leaderboard(5, 0);"
          $PSQL "$DB_URL" -c "select count(*) from chefs_tier_counts();"
          $PSQL "$DB_URL" -c "select count(*) from search_foods('butter', 5);"
          # Deliberately a TWO-argument call on the path where the old overload
          # would still be alive: Phase 31 added `p_offset`, and a `chef_top_recipes`
          # whose previous signature survived today's baseline fails 42725 here
          # rather than on a visitor's chef page (B024).
          $PSQL "$DB_URL" -c "select count(*) from chef_top_recipes((select id from profiles order by id limit 1), 3);"
          $PSQL "$DB_URL" -c "select count(*) from chef_trending_recipes((select id from profiles order by id limit 1), 5, 0);"

      # A failure above leaves the stack running; this frees the runner either
      # way and keeps the logs from ending on a Docker teardown error.
      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup || true
