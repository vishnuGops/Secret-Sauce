name: secret_sauce_workspace

packages:
  - packages/**
  - apps/**

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    description: Run flutter analyze across all packages.
    run: flutter analyze
    exec:
      concurrency: 4

  test:
    description: Run tests in packages that have them.
    run: flutter test
    exec:
      concurrency: 4
    packageFilters:
      dirExists: test

  build_runner:
    description: Run code generation (freezed / json_serializable). Only packages/core
      declares build_runner, so that is the only package this touches.
    run: dart run build_runner build --delete-conflicting-outputs
    exec:
      concurrency: 1
    packageFilters:
      dependsOn: build_runner

  format:
    description: Format all Dart code.
    run: dart format .

  # ---------------------------------------------------------------------------
  # Build tasks (run inside apps/app). Supabase creds come from env.local.json.
  # ---------------------------------------------------------------------------
  build:apk:
    description: Build a release Android APK (universal).
    run: flutter build apk --release --dart-define-from-file=env.local.json
    exec:
      concurrency: 1
    packageFilters:
      scope: app

  build:apk:split:
    description: Build release APKs split per ABI (smaller downloads).
    run: flutter build apk --release --split-per-abi --dart-define-from-file=env.local.json
    exec:
      concurrency: 1
    packageFilters:
      scope: app

  build:appbundle:
    description: Build a release Android App Bundle (.aab) for Play Store.
    run: flutter build appbundle --release --dart-define-from-file=env.local.json
    exec:
      concurrency: 1
    packageFilters:
      scope: app

  build:ios:
    description: Build a release iOS app (macOS only; unsigned archive).
    run: flutter build ios --release --no-codesign --dart-define-from-file=env.local.json
    exec:
      concurrency: 1
    packageFilters:
      scope: app

  build:ipa:
    description: Build a release iOS .ipa (macOS + signing required).
    run: flutter build ipa --release --dart-define-from-file=env.local.json
    exec:
      concurrency: 1
    packageFilters:
      scope: app

  # ---------------------------------------------------------------------------
  # App launcher icons — reads the `flutter_launcher_icons` config in
  # apps/app/pubspec.yaml. Drop your 1024x1024 PNG at apps/app/assets/icon/.
  # ---------------------------------------------------------------------------
  gen:icons:
    description: Generate Android/iOS launcher icons from the source PNG.
    run: dart run flutter_launcher_icons
    exec:
      concurrency: 1
    packageFilters:
      scope: app

  # ---------------------------------------------------------------------------
  # Authored recipes. recipeData/recipes/*.json is the source of truth for the
  # Secret Sauce Kitchen's own recipes; supabase/seed_recipes.sql is generated
  # from it and committed. No database or credentials needed — these are pure
  # file operations, unlike the db:* scripts below.
  # ---------------------------------------------------------------------------
  recipes:validate:
    description: Parse and lint recipeData/recipes/*.json. Writes nothing.
    run: dart run tool/recipes.dart validate

  recipes:gen:
    description: Regenerate supabase/seed_recipes.sql from recipeData/recipes/.
    run: dart run tool/recipes.dart gen

  recipes:check:
    description: Fail if supabase/seed_recipes.sql is stale (used by CI).
    run: dart run tool/recipes.dart check

  # Cover images for the same recipes, generated by a Gemini image model into
  # recipeData/covers/ (+ manifest.json, the provenance record). Needs
  # $GEMINI_API_KEY in the shell; `-- --dry-run` prints the prompts without it.
  # Touches no database and no Storage bucket.
  covers:gen:
    description: Generate recipeData/covers/<slug>.jpg with Gemini (skips existing).
    run: dart run tool/recipe_covers.dart

  # Put those covers in the `recipe-images` bucket at ai/<slug>.jpg — the keys
  # supabase/seed_recipes.sql points the recipes at. Targets env.local.json's
  # project with $SUPABASE_SERVICE_ROLE_KEY (shell only); non-local needs --yes.
  covers:upload:
    description: Upload recipeData/covers/*.jpg to Storage (ai/<slug>.jpg).
    run: dart run tool/recipe_covers.dart --upload

  # ---------------------------------------------------------------------------
  # Scraped recipe corpus (Phase 34). Plain node under recipeData/_tools/, data in
  # corpus/. This never touches a database and never reaches seed SQL — see
  # CLAUDE.md Gotcha 28. `corpus:harvest` fetches the public web, so it is the one
  # script here that is not free to run.
  # ---------------------------------------------------------------------------
  corpus:discover:
    description: Sitemap sweep for every registered source; cached, skips what it has.
    run: node recipeData/_tools/harvest.mjs --discover --concurrency 10

  corpus:harvest:
    description: Fetch + extract pending recipes. Per-host delay, robots-aware, resumable.
    run: node recipeData/_tools/harvest.mjs --concurrency 36 --limit 800 --discovered-only

  corpus:status:
    description: Per-source kept / done / discovered counts.
    run: node recipeData/_tools/harvest.mjs --status

  corpus:index:
    description: Rebuild index.jsonl + chefs.json / groups.json / restaurants.json.
    run: node recipeData/_tools/corpus_index.mjs

  corpus:report:
    description: Regenerate corpus/_reports/CORPUS.md from the shards.
    run: node recipeData/_tools/report.mjs

  corpus:stats:
    description: Field coverage across the shards.
    run: node recipeData/_tools/corpus_stats.mjs --fields

  corpus:clean:
    description: Collapse duplicates left by an interrupted harvest, then prune dead sources.
    run: node recipeData/_tools/dedupe.mjs && node recipeData/_tools/prune.mjs

  corpus:similar:
    description: The same dish across different chefs — overlap the fork/version model needs.
    run: node recipeData/_tools/similar.mjs

  corpus:import:plan:
    run: dart run tool/corpus_import.dart plan
    description: What the curated English-first tier would import (no database).

  corpus:import:gen:
    run: dart run tool/corpus_import.dart gen --per-source=40
    description: >
      Corpus -> corpus/_import/*.sql, one `import_recipe()` call per recipe.
      Applying them is a separate, manual psql step — see tool/corpus_import.dart.

  corpus:import:fixture:
    run: dart run tool/corpus_import.dart gen --corpus=corpus/_fixtures --out=corpus/_import_fixture --batch=3
    description: >
      The committed SYNTHETIC fixture (corpus/_fixtures/) -> corpus/_import_fixture/*.sql
      (git-ignored). No database. supabase/tests/corpus_import_fixture.sql then
      imports it, asserts every field, re-applies it and ROLLS BACK — CI runs both.

  corpus:export:
    description: Convert the corpus into the app's recipeData shape (staging only).
    run: node recipeData/_tools/corpus_export.mjs


  # ---------------------------------------------------------------------------
  # Simulation dish library. simData/dishes/*.json is an owner-agnostic LIBRARY —
  # nothing in it is a recipe until supabase/sim/2_sim_generate.sql draws from it,
  # assigns an owner and dates it. Same format and same validator as recipeData
  # (tool/recipe_format.dart), so a dish can be promoted to curated content by
  # moving the file. Pure file operations, like recipes:* above.
  # ---------------------------------------------------------------------------
  sim:validate:
    description: Parse, lint, and coverage-check simData/dishes/*.json.
    run: dart run tool/sim.dart validate

  sim:gen:
    description: Regenerate supabase/sim/1_sim_dishes.sql from simData/dishes/.
    run: dart run tool/sim.dart gen

  sim:check:
    description: Fail if supabase/sim/1_sim_dishes.sql is stale (used by CI).
    run: dart run tool/sim.dart check

  # ---------------------------------------------------------------------------
  # Food registry (docs/ROADMAP.md Phase 29). nutritionData/{foods,units}.json
  # is the committed source; supabase/nutrition_foods.sql is generated from it.
  # nutrition:* are pure file operations like recipes:*. fdc:extract is the one
  # exception: it needs the 3.1 GB USDA CSV bundle on disk (never committed) —
  # pass its path with --bundle=. Run it only when adding or refreshing foods.
  # ---------------------------------------------------------------------------
  fdc:extract:
    description: Fill foods.json `extracted` blocks from the USDA CSV bundle.
    run: dart run tool/fdc.dart
  nutrition:validate:
    description: Parse and lint nutritionData/{foods,units}.json. Writes nothing.
    run: dart run tool/nutrition.dart validate

  nutrition:gen:
    description: Regenerate supabase/nutrition_foods.sql from nutritionData/.
    run: dart run tool/nutrition.dart gen

  nutrition:check:
    description: Fail if supabase/nutrition_foods.sql is stale (used by CI).
    run: dart run tool/nutrition.dart check

  # ---------------------------------------------------------------------------
  # Database tasks. Require `psql` on PATH and a SUPABASE_DB_URL env var
  # (Supabase dashboard -> Project Settings -> Database -> Connection string).
  #   db:create  apply the schema      db:seed     load demo data
  #   db:recipes load authored recipes db:clean    truncate data (keep schema)
  #   db:drop    drop all app objects  db:reset    drop -> create -> seed ->
  #                                                recipes
  # ---------------------------------------------------------------------------
  db:create:
    description: Apply the schema (supabase/migrations/0001_init.sql).
    run: dart run tool/db.dart create

  db:seed:
    description: "TEST FIXTURE ONLY: load the 15 demo accounts (supabase/seed.sql).
      NOT part of db:reset and not in config.toml's seed paths since B113 — it
      fabricates chefs with authored counters. Run it only to populate a
      throwaway database; db:audit reports every row it creates as FAKE."
    run: dart run tool/db.dart seed

  db:recipes:
    description: Load the authored recipes (supabase/seed_recipes.sql).
    run: dart run tool/db.dart recipes

  db:nutrition:
    description: Load the food registry (supabase/nutrition_foods.sql), then
      canonicalise imported recipes' units against it (idempotent, Phase 39).
    run: dart run tool/db.dart nutrition

  db:drop:
    description: Drop all app tables, types, and functions.
    run: dart run tool/db.dart drop

  db:clean:
    description: Truncate all recipe data but keep the schema.
    run: dart run tool/db.dart clean

  db:reset:
    description: "Drop, re-create, load the food registry, load the authored
      recipes, then audit. Produces REAL CONTENT ONLY: no demo accounts and no
      simulated population (B113), and the audit step fails the run if any step
      fabricated a row. Add fixtures explicitly with db:seed / db:sim."
    run: dart run tool/db.dart reset

  # ---------------------------------------------------------------------------
  # Simulated population (docs/ROADMAP.md Phase 24). db:sim is additive and
  # idempotent; db:sim:clean is destructive and deletes auth.users rows.
  #   melos run db:sim -- --preset=small --seed=7
  # ---------------------------------------------------------------------------
  db:sim:
    description: "TEST FIXTURE ONLY: build the simulated population (schema,
      dishes, generate, verify). NOT part of db:reset since B113. It is the only
      source of dated engagement, so the ranking RPCs and the 54 sim assertions
      need it — build it in a throwaway database, never one you demo from.
      db:audit reports every row it creates as FAKE."
    run: dart run tool/db.dart sim

  db:sim:verify:
    description: Re-run the sim assertion suite. Read-only.
    run: dart run tool/db.dart sim:verify

  # The per-persona RLS smoke (Phase 24's last open verification item). Seats one
  # real actor per persona from the sim.actor registry and re-runs the policy
  # claims as that SIGNED-IN user — the gap between db:sim:verify (which runs as
  # `postgres` and bypasses every policy) and db:rls (which builds its own
  # three-user fixture). Not part of db:sim: it writes before it rolls back, and
  # db:sim runs inside db:reset. Run it alongside db:rls, never instead of it.
  db:sim:rls:
    description: RLS per persona, as a signed-in sim actor. Rolls back.
    run: dart run tool/db.dart sim:rls

  db:sim:clean:
    description: Remove every simulated account and recipe. DESTRUCTIVE — needs --yes.
    run: dart run tool/db.dart sim:clean

  # ---------------------------------------------------------------------------
  # RLS acceptance matrix (docs/ROADMAP.md BL-7). Everything else that touches
  # this schema runs as `postgres`, which bypasses policies; this is the only
  # thing that exercises them as a signed-in user. It writes fixtures and then
  # rolls the whole transaction back, so it leaves nothing behind — run it after
  # any change to a policy, a `security definer` function, or the column grants.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Backups (B087, Phase 32f5). Read-only, and the ONLY undo production has —
  # the free tier has no PITR. Two files per run because `--schema=public` alone
  # restores into a project with no accounts behind its profiles.
  #   melos run db:backup -- --docker --out=C:\backups\secret-sauce
  # `--docker` runs pg_dump in postgres:17-alpine: a client older than the
  # server aborts, and the local stack ships 15.8 against a hosted 17.x (B079).
  # ---------------------------------------------------------------------------
  db:backup:
    description: Dump public + auth data, timestamped. Read-only; see README.md#backups.
    run: dart run tool/db.dart backup

  # ---------------------------------------------------------------------------
  # Keeping the hosted project in sync with this repo.
  #
  # The hosted project has NO `supabase_migrations.schema_migrations` table — it
  # was applied by hand through psql, never by `supabase db push` — so there is
  # no recorded version to compare against. The check below therefore compares
  # the thing that actually matters: a catalogue inventory of both schemas.
  #
  # Both commands need `--docker` on this machine (no psql on PATH, B033), and
  # `--docker` is the right form for hosted regardless, because the local
  # stack's client is 15.8 against a hosted 17.6 (B079).
  # ---------------------------------------------------------------------------

  db:corpus:
    description: Apply corpus/_import/*.sql — the captured recipes (Phase 35c).
      Idempotent; run `melos run corpus:import:gen` first to produce the files.
      Not part of db:reset — a reset is the 14 curated recipes.
    run: dart run tool/db.dart corpus

  db:fingerprint:
    description: Inventory the public schema — tables, columns, enums, function
      signatures, RLS, policies, grants, indexes, triggers, constraints.
      READ-ONLY. Redirect it to a file and diff two databases; db:hosted:check
      does exactly that for you.
    run: dart run tool/db.dart fingerprint

  db:hosted:check:
    description: "Has the hosted project drifted from this repo? Fingerprints
      SUPABASE_DB_URL and the local stack and diffs them. READ-ONLY — safe to run
      any time, and the thing to run before and after a deploy."
    run: dart run tool/hosted_check.dart

  db:hosted:deploy:
    description: "Bring SUPABASE_DB_URL up to this repo: schema -> food registry
      -> curated recipes -> captured corpus -> audit --strict. Additive and
      idempotent, contains NO drop, so it is safe against a database holding real
      accounts. Requires --yes. Take a db:backup first — the free tier has no PITR."
    run: dart run tool/db.dart hosted:deploy

  db:rls:
    description: Run the RLS matrix as anon/owner/shared/stranger. Rolls back.
    run: dart run tool/db.dart rls

  # ---------------------------------------------------------------------------
  # Fabricated-data audit (B112/B113/B114). The audit is read-only and safe
  # anywhere, including the hosted project; the purge deletes auth.users rows
  # and is the one command here with no undo.
  # ---------------------------------------------------------------------------

  db:audit:
    description: Classify every profile, recipe and account as real or fabricated,
      and report per bucket. READ-ONLY — creates temporary tables and nothing else.
      Runs as the last step of db:reset in strict mode, where a finding fails the run.
    run: dart run tool/db.dart audit

  db:purge:fake:
    description: "DESTRUCTIVE: remove every fabricated row — sim teardown, then
      seed.sql's fixed-id demo fixtures and ingest.mjs's impersonation accounts,
      then repair authored counters — and re-audit. Keeps the captured corpus,
      the harvester's imported bylines, Secret Sauce Kitchen and every real
      signup. Deletes auth.users rows, so needs --yes; back up first (db:backup)."
    run: dart run tool/db.dart purge:fake

  # ---------------------------------------------------------------------------
  # Auto-nutrition SQL (Phase 29). The estimator's arithmetic has no other
  # coverage — `packages/core` decodes canned replies and the RLS matrix proves
  # policy geometry, and neither can say whether a cup of flour weighs 120 g.
  # db:nutrition:verify is the other half: seed_recipes.sql's twelve `auto`
  # labels are static JSON, so it re-estimates them against the LOADED registry
  # and fails when the two have drifted apart — unlike `nutrition:check` above,
  # which is a pure file check and never opens a connection. Both roll back.
  # ---------------------------------------------------------------------------
  db:nutrition:estimate:
    description: Estimator arithmetic on fixture trees, exact labels. Rolls back.
    run: dart run tool/db.dart nutrition:estimate

  db:nutrition:verify:
    description: Committed auto labels vs. the loaded registry + the backfill. Rolls back.
    run: dart run tool/db.dart nutrition:verify
