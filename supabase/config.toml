# Supabase config for Secret-Sauce local development.
project_id = "secret-sauce"

[api]
enabled = true
port = 54621
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54622
shadow_port = 54620
major_version = 15

[db.pooler]
enabled = false
port = 54629

# `supabase db reset` applies these in order after the migrations.
#
# `./seed.sql` is DELIBERATELY ABSENT (B113). It creates 15 demo accounts — 7
# leaderboard chefs with authored counters and 8 taster accounts — and listing
# it here meant `supabase db reset` put invented chefs on every developer's
# leaderboard as though they were users. It is a test fixture now: CI applies it
# to its throwaway Postgres and `melos run db:seed` still runs it on demand.
# Keep this list to real content only, and keep it in step with the `reset`
# pipeline in tool/db.dart — they are two descriptions of the same thing, and
# the whole reason `reset` ends in an `audit` step is to catch them drifting.
#
# The remaining order is still load-bearing: nutrition_foods.sql must precede
# seed_recipes.sql, because Phase 29b gives ingredients a food_id FK into the
# registry. seed_recipes.sql needs nothing from seed.sql — it bootstraps the
# Secret Sauce Kitchen account itself, and no longer applies demo ratings.
[db.seed]
enabled = true
sql_paths = ["./nutrition_foods.sql", "./seed_recipes.sql"]

[studio]
enabled = true
port = 54623

[inbucket]
enabled = true
port = 54624

[analytics]
enabled = false
port = 54627

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true

[storage]
enabled = true
