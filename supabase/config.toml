# Supabase config for Secret-Sauce local development.
project_id = "secret-sauce"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

# `supabase db reset` applies these in order after the migrations. The order is
# load-bearing: seed_recipes.sql reaches seed.sql's taster accounts for its demo
# ratings through a to_regprocedure() guard, so running it first would create the
# recipes but skip their ratings.
[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_recipes.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true

[storage]
enabled = true
