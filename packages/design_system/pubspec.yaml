name: design_system
description: Shared UI kit — theme, RecipeCard, and adaptive widgets for Secret-Sauce.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

# Bundled type (Phase 36b; one family since 36c, owner decision 2026-09-25). OFL 1.1 — the license
# files sit beside the fonts. Static instances from Google Fonts, one file per
# weight, so `fontWeight` selects a real cut instead of a synthesized bold.
# Referenced as `packages/design_system/<family>` (AppFonts in
# lib/src/theme/app_typography.dart).
flutter:
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Regular.ttf
          weight: 400
        - asset: fonts/Manrope-Medium.ttf
          weight: 500
        - asset: fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: fonts/Manrope-Bold.ttf
          weight: 700
        - asset: fonts/Manrope-ExtraBold.ttf
          weight: 800
